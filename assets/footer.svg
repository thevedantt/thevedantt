<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3A0B0B" stroke-width="0.6" opacity="0.55"/></pattern>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF1E1E" stop-opacity="0"/><stop offset="0.5" stop-color="#FF1E1E" stop-opacity="0.10"/><stop offset="1" stop-color="#FF1E1E" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#8B0000" stop-opacity="0.35"/><stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/></radialGradient>

</defs>
<style>
.blink{animation:bl 1.1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.4s ease-in-out infinite} @keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}} .fi{animation:fi .4s ease-out backwards}
.flow{stroke-dasharray:4 8;animation:fl 1.6s linear infinite} @keyframes fl{to{stroke-dashoffset:-24}}
</style>
