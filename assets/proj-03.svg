<svg xmlns="http://www.w3.org/2000/svg" width="330" height="200" viewBox="0 0 330 200" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
<defs>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3A0B0B" stroke-width="0.6" opacity="0.55"/></pattern>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF1E1E" stop-opacity="0"/><stop offset="0.5" stop-color="#FF1E1E" stop-opacity="0.10"/><stop offset="1" stop-color="#FF1E1E" stop-opacity="0"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#8B0000" stop-opacity="0.35"/><stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/></radialGradient>

</defs>
<style>
.blink{animation:bl 1.1s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.4s ease-in-out infinite} @keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}} .fi{animation:fi .4s ease-out backwards}
.flow{stroke-dasharray:4 8;animation:fl 1.6s linear infinite} @keyframes fl{to{stroke-dashoffset:-24}}
</style>
<rect width="330" height="200" rx="10" fill="#0A0A0A"/>
<rect x="0.5" y="0.5" width="329" height="199" rx="10" fill="none" stroke="#3A0B0B"/><rect x="0" y="0" width="330" height="3" rx="1" fill="#FF1E1E"><animate attributeName="width" from="0" to="330" dur="1.2s" begin="0.15s" fill="freeze"/></rect><text x="20" y="34" fill="#7A7A7A" font-size="11" letter-spacing="2">P/03</text><circle cx="308" cy="30" r="4" fill="#8B0000"/><text x="20" y="66" fill="#FF1E1E" font-size="22" font-weight="800" letter-spacing="1">SYNAPSE</text><text x="20" y="92" fill="#D6D6D6" font-size="12">Enterprise AI agent over MCP servers:</text><text x="20" y="109" fill="#D6D6D6" font-size="12">Postgres, Slack, Sheets, reports. Each</text><text x="20" y="126" fill="#D6D6D6" font-size="12">number is checked against tool output.</text><rect x="20" y="160" width="65" height="20" rx="3" fill="none" stroke="#8B0000"/><text x="52.5" y="174" fill="#D6D6D6" font-size="10.5" text-anchor="middle">FastAPI</text><rect x="91" y="160" width="37" height="20" rx="3" fill="none" stroke="#8B0000"/><text x="109.5" y="174" fill="#D6D6D6" font-size="10.5" text-anchor="middle">MCP</text><rect x="134" y="160" width="65" height="20" rx="3" fill="none" stroke="#8B0000"/><text x="166.5" y="174" fill="#D6D6D6" font-size="10.5" text-anchor="middle">Bedrock</text><rect x="205" y="160" width="65" height="20" rx="3" fill="none" stroke="#8B0000"/><text x="237.5" y="174" fill="#D6D6D6" font-size="10.5" text-anchor="middle">Next.js</text><text x="312" y="176" fill="#FF1E1E" font-size="11" font-weight="700" text-anchor="end">→</text>
